<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Learn React</title>
  </head>
  <body>
    <h1>I am above root</h1>
    <div id="root">
      <h1>Adwait was here!</h1>
      <!-- This h1 tag will be loaded first. But as soon as the react root renders something here, the h1 previously here will be replaced by that.  -->
      <!-- So root.render() is replacing (not appending) things here inside this id="root". Not just one thing but everything. -->
    </div>
    <div id="something">
      <h1>I am something else</h1>
    </div>
    <h1>I am below root</h1>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <script src="./App.js"></script>
  </body>
</html>
